<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EcoPack Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind.config.js"></script>
    <link rel="stylesheet" href="assets/css/index.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-soft-beige dark:bg-charcoal text-charcoal dark:text-soft-beige font-sans min-h-screen flex flex-col">
    
    <main class="flex-grow grid lg:grid-cols-2">
        <!-- Illustration Side -->
        <div class="hidden lg:block relative h-full bg-leaf-green">
            <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Eco Background" class="absolute inset-0 w-full h-full object-cover mix-blend-overlay opacity-30">
            <div class="absolute inset-0 bg-gradient-to-t from-leaf-green-dark/80 to-transparent"></div>
            <div class="absolute bottom-12 left-12 right-12 text-white">
                <h2 class="text-3xl font-bold mb-4">Welcome back to EcoPack</h2>
                <p class="opacity-90 leading-relaxed">Manage your sustainable packaging orders, track shipments, and view your carbon offset analytics all in one place.</p>
            </div>
            <!-- Theme Toggle for desktop -->
            <div class="absolute top-8 left-8">
                <button class="theme-toggle p-2 bg-white/10 backdrop-blur-md rounded-full text-white hover:bg-white/20 transition-colors">
                    <i data-feather="moon" class="w-5 h-5 dark:hidden"></i>
                    <i data-feather="sun" class="w-5 h-5 hidden dark:block"></i>
                </button>
            </div>
        </div>

        <!-- Form Side -->
        <div class="flex flex-col justify-center items-center p-8 lg:p-12 relative overflow-y-auto w-full h-full bg-white dark:bg-charcoal">
            <!-- Mobile Toggle -->
            <button class="lg:hidden theme-toggle absolute top-6 right-6 p-2 text-charcoal dark:text-soft-beige">
                <i data-feather="moon" class="w-5 h-5 dark:hidden"></i>
                <i data-feather="sun" class="w-5 h-5 hidden dark:block"></i>
            </button>

            <div class="w-full max-w-md fade-in">
                <!-- Logo -->
                <a href="index.html" class="flex items-center gap-2 mb-10 justify-center">
                    <div class="w-10 h-10 bg-leaf-green/10 rounded-xl flex items-center justify-center text-leaf-green">
                        <i data-feather="package" class="w-6 h-6"></i>
                    </div>
                    <span class="font-bold text-2xl tracking-tight text-leaf-green">EcoPack</span>
                </a>

                <h1 class="text-3xl font-bold mb-2 text-center">Sign into your account</h1>
                <p class="text-charcoal-light dark:text-gray-400 mb-8 text-center">Enter your details to access your dashboard.</p>

                <form class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium mb-2">Email Address</label>
                        <input type="email" class="w-full bg-soft-beige dark:bg-black/20 border border-transparent focus:border-leaf-green rounded-lg px-4 py-3 outline-none transition-all" placeholder="name@company.com" required>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-medium">Password</label>
                            <a href="#" class="text-xs font-semibold text-leaf-green hover:underline">Forgot password?</a>
                        </div>
                        <input type="password" class="w-full bg-soft-beige dark:bg-black/20 border border-transparent focus:border-leaf-green rounded-lg px-4 py-3 outline-none transition-all" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="w-full py-3.5 bg-leaf-green hover:bg-leaf-green-dark text-white rounded-lg font-bold transition-all shadow-lg shadow-leaf-green/30">Sign In</button>
                </form>

                <div class="mt-8">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-black/10 dark:border-white/10"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white dark:bg-charcoal text-charcoal-light dark:text-gray-400">Or continue with</span>
                        </div>
                    </div>

                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <button class="w-full flex justify-center items-center py-2.5 border border-black/10 dark:border-white/10 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors text-sm font-medium">
                            <i data-feather="github" class="w-4 h-4 mr-2"></i> GitHub
                        </button>
                        <button class="w-full flex justify-center items-center py-2.5 border border-black/10 dark:border-white/10 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors text-sm font-medium">
                            <i data-feather="mail" class="w-4 h-4 mr-2"></i> Google
                        </button>
                    </div>
                </div>

                <p class="mt-10 text-center text-sm text-charcoal-light dark:text-gray-400">
                    Don't have an account? <a href="register.html" class="font-semibold text-leaf-green hover:underline">Register now</a>
                </p>
            </div>
        </div>
    </main>



    <script src="assets/js/main.js"></script>
    <script>feather.replace();</script>
</body>
</html>
